/* ===== Markdown for AI replies =====

   md(text, live, plain)

 .replace(/(^|[^*\w])\*(?=[^\s*])([^*\n]*?[^\s*])\*(?!\*)/g,'$1<i>$2</i>')
 .replace(/(^|[^\w])_(?=\S)([^_\n]*?\S)_(?!\w)/g,'$1<i>$2</i>')
 .replace(/~~(?=\S)([\s\S]*?\S)~~/g,'<del>$1</del>');

 let s=String(raw).replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g,(m,q,c)=>tk('<code>'+e(c.trim())+'</code>'))
  .replace(/<((?:https?:\/\/|mailto:)[^\s<>]+)>/g,(m,u)=>A(e(u),e(u)));
 s=e(s).replace(/&#60;br\s*\/?&#62;/gi,'<br>').replace(/\\([\\`*_{}\[\]()#+\-.!|~>])/g,(m,c)=>'&#'+c.charCodeAt(0)+';');
 s=s.replace(/\[([^\]\n]+)\]\(\s*((?:https?:\/\/|mailto:)[^\s)]+)(?:\s+&#34;[^)]*?&#34;)?\s*\)/g,(m,t,u)=>A(u,mdE(t)))
  .replace(/(^|[\s(])(https?:\/\/[^\s]*[^\s.,;:!?)\]])/g,(m,p,u)=>p+A(u,u));
 s=mdE(s);
 for(let n=0;n<4&&/\u0000\d+\u0000/.test(s);n++)s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>K[i]);

function mdB(L,pl){
