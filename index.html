.app:not(.admin) .bnav .on .ic{width:44px;height:44px;border-radius:50%;background:var(--pr);color:#fff;transform:translateY(-14px);margin-bottom:-14px;box-shadow:0 6px 14px #16653466}
.bnav.an .on .ic{animation:bub .4s cubic-bezier(.3,1.6,.5,1)}
.fab{bottom:calc(96px + env(safe-area-inset-bottom))}#tst{bottom:104px}.page{padding-bottom:130px}}

.hd{flex-wrap:wrap}
.sbl{max-height:38vh;overflow-y:auto;border:1px solid var(--bd);border-radius:8px;margin-top:8px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid var(--bd);background:#fff;padding:9px 12px;text-align:left}.sr:first-child{border-top:0}.sr.on{background:#f1faf4}
.dots u.ev{border-radius:2px;background:var(--pr);transform:rotate(45deg)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.pg{background:repeating-linear-gradient(#fff 0 25px,#e6f1e9 25px 26px);cursor:pointer;transition:transform .2s}.pg:hover{transform:translateY(-3px) rotate(-.4deg)}
.pg p{line-height:26px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.rt{grid-template-columns:2fr 1fr}

.bell{position:relative;border:1px solid var(--bd);background:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--pr)}
.bell i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--er);color:#fff;font:700 11px/18px "Source Sans 3",sans-serif;text-align:center;padding:0 4px}
#pop.wide{width:360px;max-height:70vh;overflow-y:auto}.ph{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 10px}
.nt{display:flex;gap:10px;width:100%;text-align:left;border:0;border-radius:8px;background:none;padding:10px 8px;align-items:flex-start}.nt:hover{background:var(--pl)}.nt.un{background:#f1faf4}
.dt{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}.dt.er{background:var(--er)}.dt.wn{background:var(--wn)}.dt.in{background:var(--in)}
input[type=checkbox]{accent-color:var(--pr)}.tg{cursor:pointer}
.fq{font-size:15px;color:var(--tx);border-top:1px solid var(--bd)}.fq:first-of-type{border-top:0}.fq summary{cursor:pointer;font-weight:600;padding:10px 0}.fq p{padding:0 0 10px;color:var(--mu)}
@media(max-width:820px){#pop.wide{width:auto;max-height:75vh}}

function saveTask(f){T.push(wrap({id:Date.now(),col:f.k.checked,sm:{},t:f.t.value.trim(),c:f.c.value,d:f.d.value,p:f.p.value,desc:f.x.value.trim(),s:'Not started'}));$('#dlg').close();toast('Task added. It now appears in Work and Home.');render();return false}

const login=()=>`<div class="lg"><section class="lb"><div class="logo">${LG}<span>TASKLY<small>Senior High School Department</small></span></div><h1>Tasks, classes, and records for SHS teachers.</h1><p>The official productivity and monitoring system of the Senior High School Department.</p><ul><li>Plan work and deadlines</li><li>Track class submissions</li><li>Keep SHS leadership informed</li></ul></section>

function home(){

</div><div class="g"><div class="card"><h2>Pending submissions</h2>${op.filter(t=>t.col&&t.sub[1]>t.sub[0]).map(t=>`<div class="row" onclick="tk(${t.id})"><div class="fl"><b>${e(t.t)}</b><div class="mu">${t.c}</div></div><span class="b wn">${t.sub[1]-t.sub[0]} pending</span></div>`).join('')||empty('All caught up','No pending submissions.')}</div><div class="card"><h2>Upcoming events</h2>${EV.filter(v=>dd(v.d)>=0&&dd(v.d)<=14).sort((a,b)=>dd(a.d)-dd(b.d)).slice(0,3).map(v=>`<div class="row"><div class="fl"><b>${e(v.t)}</b><div class="mu">${v.tm||'All day'}${v.n?', '+e(v.n):''}</div></div><span class="b in">${lab(v.d)}</span></div>`).join('')||empty('No events','Nothing on your calendar for two weeks.')}</div><div class="card"><a class="fr" href="#" onclick="bell();return false">View all</a><h2>Notifications</h2>${NF().sort((x,y)=>ORD[x.ty]-ORD[y.ty]).slice(0,3).map(n=>`<div class="row" onclick="nopen('${n.k}',${n.id||0})"><div class="fl">${e(n.t)}<div class="mu">${e(n.s)}</div></div></div>`).join('')||empty('All caught up','No notifications right now.')}</div>

const row=t=>`<div class="tk ${t.s=='Done'?'dn':''}" onclick="tk(${t.id})"><button class="ck2" title="Mark done or reopen" onclick="event.stopPropagation();tog(${t.id})">${t.s=='Done'?'✓':''}</button><div class="tt"><b>${e(t.t)}</b><span class="mu">${t.c}${t.sub[1]?`, ${t.sub[0]} of ${t.sub[1]} submitted`:''}</span></div><div class="mt">${dl(t)}<span class="b ${PR[t.p]}">${t.p}</span><span class="b ${ST[t.s]}">${t.s}</span></div></div>`;
