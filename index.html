.nx{background:#ffffff1a}
.ds-b.dn{background:#ffffff33;color:#e3f1e8}.ds-b.dn::before{content:"\2713 ";margin-right:3px}
.ds-now::before{animation:ping 1.8s infinite}
.dchips{display:none;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}

body .cnv{flex-wrap:wrap}
body .cnv .btn.pr{width:auto;border-radius:99px;padding:0 18px;font-size:14px;white-space:nowrap}

body .calw>.card:first-child::before{content:"";position:absolute;top:-12px;left:22px;right:22px;height:24px;background:radial-gradient(ellipse 6px 10px at 50% 50%,#fff 0 45%,#0b2a1d 50% 72%,transparent 77%) 0 0/26px 24px repeat-x;pointer-events:none}
body .pg{position:relative;background:var(--pc,#fff6b0);border:0;border-radius:3px 3px 14px 3px;box-shadow:0 14px 20px -12px #0b2a1d66;transform:rotate(var(--rt,-1deg));padding:22px 18px 16px;min-height:150px;transition:transform .25s}
#nl>.pg:nth-child(4n+1){--pc:#fff6b0;--rt:-1.2deg}#nl>.pg:nth-child(4n+2){--pc:#cdeedb;--rt:.9deg}#nl>.pg:nth-child(4n+3){--pc:#ffd9c9;--rt:-.6deg}#nl>.pg:nth-child(4n){--pc:#d4e6fb;--rt:1.1deg}
body .pg::before{content:"";position:absolute;top:-9px;left:50%;width:60px;height:18px;margin-left:-30px;background:#ffffffb0;transform:rotate(2deg);box-shadow:0 1px 2px #0b2a1d22}
body .card.pg>h2{display:block;width:auto;margin:0 0 6px;padding:0;background:none;border:0;border-radius:0;font:700 25px/1.1 Caveat,var(--hf)}
body .pg p{font:600 20px/23px Caveat,var(--hf);color:#2d3b33}
body .ed{background:linear-gradient(90deg,transparent 54px,#f2b8b0 54px 55px,transparent 55px),repeating-linear-gradient(#fff 0 27px,#dcebe1 27px 28px);padding:6px 20px 40px 72px;border-radius:6px 18px 18px 18px}

.lrw{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
body .card:has(>.tile){display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 18px;padding:0;background:none;border:0;box-shadow:none}
.tile:nth-child(4n+1){--tc:#fff0a8}.tile:nth-child(4n+2){--tc:#cdeedb}.tile:nth-child(4n+3){--tc:#ffd9c9}.tile:nth-child(4n){--tc:#d4e6fb}

body .emp b{font:700 26px/1.1 Caveat,var(--hf);color:var(--ink)}
body #tst{background:var(--hl);color:var(--ink);border-radius:3px 3px 14px 3px;font-weight:700;box-shadow:0 14px 24px -12px #0b2a1d77}
.an .card,.an .note,.an .stat,.an .tile{animation:pgIn .55s cubic-bezier(.2,.8,.2,1) both}

body .g{gap:28px 14px}

/* ===== TASKLY create-flow layer ===== */
body dialog:has(.cf){padding:0;border:0;width:min(580px,calc(100% - 24px));max-height:min(92dvh,880px);overflow:hidden;border-radius:6px 24px 24px 24px;background:#fffdf8;box-shadow:0 36px 70px -24px #0b2a1dcc}
dialog[open]:has(.cf){display:flex;flex-direction:column}
dialog:has(.cf)::backdrop{background:#0b2a1d99;backdrop-filter:blur(3px)}
.cf{display:flex;flex-direction:column;min-height:0;flex:1}
.cf-h{display:flex;align-items:center;gap:14px;padding:20px 22px 14px}
.cf-ic{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:14px;background:#ffe45e;color:var(--ink);transform:rotate(-4deg)}.cf-ic.ev{background:#9fe0bd}
.cf-h h2{margin:0;font:800 25px/1.1 var(--hf);letter-spacing:-.02em}.cf-h p{margin:3px 0 0;color:var(--mu);font-size:14px}
.cf-x{margin-left:auto;align-self:flex-start}
.cf-b{overflow:auto;display:grid;gap:22px;padding:4px 22px 20px;overscroll-behavior:contain}

.cf section{display:grid;gap:10px}

.cf h3 small,.cf small{color:var(--mu);font-weight:500}
body .cf-t{font:700 20px/1.2 var(--hf);padding:14px 16px;border-width:2px}
.cf-ch{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cf-r{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cf-hint{margin:0;color:var(--mu);font-size:13.5px}.cf-hint.wn{color:var(--wn)}
.cf [hidden]{display:none!important}
.cfc{position:relative;display:inline-flex;align-items:center;padding:9px 15px;border-radius:99px;border:1.5px solid var(--bd);background:#fff;font:600 14px Figtree,system-ui,sans-serif;color:var(--tx);cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.cfc input,.cfp input,.cfs input{position:absolute;opacity:0;pointer-events:none}
.cfc:hover{border-color:var(--pr);transform:translateY(-1px)}
.cfc.on,.cfc:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.cfc:has(input:focus-visible),.cfp:has(input:focus-visible),.cfs:has(input:focus-visible){outline:2px solid var(--pr);outline-offset:2px}
.cf-pr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cfp{position:relative;display:grid;gap:1px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:#fff;cursor:pointer;transition:background .15s,box-shadow .15s}
.cfp b{font:700 19px/1.1 Caveat,var(--hf)}
.cfp.er:has(input:checked){background:#fdeceb;border-color:var(--er,#ae2a1f);box-shadow:inset 0 -4px 0 var(--er,#ae2a1f)}
.cfp.wn:has(input:checked){background:#fdf1d8;border-color:var(--wn,#9a5b06);box-shadow:inset 0 -4px 0 var(--wn,#9a5b06)}
.cfp.in:has(input:checked){background:#e5eefc;border-color:var(--in,#2257c4);box-shadow:inset 0 -4px 0 var(--in,#2257c4)}

.cfv{display:grid;gap:8px;padding:14px 16px;border-radius:6px 16px 16px 16px;border:1px dashed #d9c98a;background:repeating-linear-gradient(#fffdf3 0 27px,#efe9cf 27px 28px)}

.hub-t:last-child{grid-column:1/-1}
body .days{display:flex;flex-wrap:wrap;gap:8px}
body .days .ck{position:relative;padding:8px 14px;border-radius:99px;border:1.5px solid var(--bd);background:#fff;cursor:pointer;font-weight:600}
body .days .ck input{position:absolute;opacity:0}
body .days .ck:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.fq[hidden]{display:none}
.cnf{position:fixed;z-index:99;width:9px;height:12px;border-radius:2px;pointer-events:none;animation:cnf 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cnf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* AI assistant (chat style) */
const cxMsgs=()=>{const er=AI.err?`<p class="er cxr">${e(AI.err)}</p>`:'';

function cxUp(){const s=$('#cxs');if(!s)return;s.innerHTML=cxMsgs();s.scrollTop=s.scrollHeight;const b=$('#aib');if(b)b.disabled=!!(AI.busy||AI.typ)}
const cxGrow=t=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'},cxPick=i=>{const q=$('.cxc textarea');q.value=uSug[i][1];cxGrow(q);q.focus()};
async function aiSend(f,t){const inp=(t||f.q.value).trim();if(!inp||AI.busy||AI.typ)return false;AI.m='chat';AI.h.push({role:'user',text:inp});if(f&&f.q){f.q.value='';cxGrow(f.q)}AI.busy=1;AI.err='';cxUp();
try{const r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await tok()},body:JSON.stringify({mode:'chat',input:inp,history:AI.h.slice(0,-1)})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'The assistant is not available. Make sure the Vercel function is deployed.');AI.busy=0;AI.h.push({role:'model',text:''});cxType(AI.h.length-1,d.text||'')}
catch(x){AI.busy=0;AI.err=x.message;AI.h.pop();cxUp();const q=$('.cxc textarea');if(q&&!q.value){q.value=inp;cxGrow(q)}}
return false}
function cxType(i,full){if(matchMedia('(prefers-reduced-motion:reduce)').matches){AI.h[i].text=full;return cxUp()}AI.typ=1;let n=0;const go=()=>{n=Math.min(full.length,n+Math.max(3,full.length/90|0));AI.h[i].text=full.slice(0,n);if(n<full.length&&$('#cxs')){cxUp();requestAnimationFrame(go)}else{AI.h[i].text=full;AI.typ=0;cxUp()}};go()}
const aiNew=()=>{if(AI.busy||AI.typ)return;AI.h=[];AI.err='';cxUp()},aiRegen=()=>{if(AI.busy||AI.typ)return;AI.h.pop();const u=AI.h.pop();if(u)aiSend(null,u.text)},aiCopy2=i=>navigator.clipboard.writeText(AI.h[i].text).then(()=>toast('Copied.')),

{const _r=render;render=function(){_r();const s=$('#cxs');if(s)s.scrollTop=s.scrollHeight}}
/* Mini-games */
const G2={sc:[{n:'Team 1',p:0},{n:'Team 2',p:0}],die:[],coin:'',mem:null,lk:0,rl:0,pr:'HTML = Page structure\nCSS = Page style\nJS = Page behavior\nSQL = Database language\nRAM = Short-term memory\nCPU = The brain of a computer'};
const uSc=(i,v)=>{G2.sc[i].p=Math.max(0,G2.sc[i].p+v);render()},uRoll=n=>{G2.coin='';G2.die=Array.from({length:n},()=>1+Math.random()*6|0);G2.rl=1;render();G2.rl=0},uFlip=()=>{G2.die=[];G2.coin=Math.random()<.5?'Heads':'Tails';render()};
function uMem(f){G2.pr=f.p.value;const p=G2.pr.split('\n').map(x=>x.split('=')).filter(x=>x.length>1&&x[0].trim()&&x[1].trim()).slice(0,8),c=[];p.forEach((x,k)=>c.push({k,t:x[0].trim()},{k,t:x.slice(1).join('=').trim()}));if(c.length<4){toast('Add at least 2 pairs, one per line.');return false}
for(let i=c.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[c[i],c[j]]=[c[j],c[i]]}G2.mem={cards:c,open:[],done:[],mv:0};render();return false}
function uFlipC(i){const m=G2.mem;if(G2.lk||m.open.includes(i)||m.done.includes(i))return;m.open.push(i);if(m.open.length==2){m.mv++;const[a,b]=m.open;if(m.cards[a].k==m.cards[b].k){m.done.push(a,b);m.open=[]}else{G2.lk=1;setTimeout(()=>{m.open=[];G2.lk=0;render()},900)}}render()}
{const _g=gamesP,GM=[['roul','Name Roulette','Spin to pick a student.','#ffd9c9'],['team','Team Maker','Shuffle into teams.','#d6e8ff'],['time','Class Timer','Countdown for activities.','#d8f3dc'],['score','Scoreboard','Keep team points.','#fff3b0'],['dice','Dice and Coin','Roll or flip.','#f3d9ff'],['mem','Memory Match','Match terms to meanings.','#ffe0ec']];
gamesP=function(){const g=S.gm;if(['roul','team','time'].includes(g))return _g();

const back=`<button class="bk" onclick="S.gm=null;S.an=1;render()">‹ Mini-Games</button>`;
if(g=='score')return back+`<h1>Scoreboard</h1><div class="sbd">${G2.sc.map((s,i)=>`<div class="scc" style="--h:${i*57%360}"><input value="${e(s.n)}" onchange="G2.sc[${i}].n=this.value" aria-label="Team name"><b>${s.p}</b><div><button onclick="uSc(${i},-1)" aria-label="Minus one">−</button><button onclick="uSc(${i},1)">+1</button><button onclick="uSc(${i},5)">+5</button></div></div>`).join('')}</div><div class="act l"><button class="btn" onclick="G2.sc.push({n:'Team '+(G2.sc.length+1),p:0});render()">Add team</button><button class="btn" onclick="G2.sc.forEach(s=>s.p=0);render()">Reset scores</button></div>`;
if(g=='dice')return back+`<h1>Dice and Coin</h1><div class="dcw"><div class="die ${G2.rl?'roll':''}">${G2.die.length?G2.die.map(v=>`<span class="dv">${v}</span>`).join(''):'<span class="dv">?</span>'}</div><div class="act l"><button class="btn pr" onclick="uRoll(1)">Roll 1 die</button><button class="btn" onclick="uRoll(2)">Roll 2 dice</button><button class="btn" onclick="uFlip()">Flip a coin</button></div><div class="coin ${G2.coin?'fl':''}">${G2.coin||''}</div></div>`;
const m=G2.mem;if(!m)return back+`<h1>Memory Match</h1><p class="mu">Type one pair per line, like: HTML = Page structure</p><form class="card gm" onsubmit="return uMem(this)" style="display:grid;gap:12px"><textarea name="p" rows="7">${e(G2.pr)}</textarea><button class="btn pr">Start game</button></form>`;
return back+`<h1>Memory Match</h1><p class="mu">${m.done.length/2} of ${m.cards.length/2} pairs found, ${m.mv} moves</p><div class="mg">${m.cards.map((c,i)=>{const d=m.done.includes(i);return `<button class="mc ${d||m.open.includes(i)?'o':''} ${d?'d':''}" onclick="uFlipC(${i})">${d||m.open.includes(i)?e(c.t):'?'}</button>`}).join('')}</div>${m.done.length==m.cards.length?'<div class="note">All matched. Great job.</div>':''}<div class="act l" style="margin-top:12px"><button class="btn" onclick="G2.mem=null;render()">New game</button></div>`}}
/* Task as a notebook page */
function tk(id){const t=T.find(x=>x.id==id),d=$('#dlg'),p=t.sub[1]?Math.round(t.sub[0]/t.sub[1]*100):0,ys=$('#dlg .sbl'),y0=ys?ys.scrollTop:0,sc={'Not started':'mu','In progress':'in','Done':'ok'};
d.innerHTML=`<div class="nb"><div class="nbr">${'<i></i>'.repeat(7)}</div><div class="nbp2"><div class="nbt"><span class="tape">${e(t.c)}</span><button class="x" onclick="$('#dlg').close()" aria-label="Close">×</button></div><h2 class="nbh">${e(t.t)}</h2><div class="nbm">${dl(t)}<span class="mk ${PR[t.p]}">${t.p} priority</span><span class="stmp ${sc[t.s]}">${t.s}</span></div>

<div class="nbt2">${['Not started','In progress','Done'].map(v=>`<button class="${t.s==v?'on':''}" onclick="setSt(${id},'${v}')">${v}</button>`).join('')}</div><div class="act"><button class="btn" onclick="editTask(${id})">Edit</button><button class="btn" onclick="arch(${id})">Archive</button><button class="btn" onclick="delT(${id})">Delete</button></div></div></div>`;

/* Smart quick-add: "Quiz tomorrow 3pm" fills the date and time */
function uSmart(f){const i=f.t;let v=i.value,d=null,m=null;if(!v)return;

if(d==null&&m==null)return;i.value=v.replace(/\s{2,}/g,' ').replace(/\b(on|at|by|due)\s*$/i,'').trim();const b=[];if(d!=null&&f.d){f.d.value=ymd(d);b.push(lab(ymd(d)))}if(m&&f.m){f.m.value=m;b.push(t12(m))}

{const _nt=newTask,_ne=newEvent,sm=()=>{const f=$('#dlg form'),i=f&&f.t;if(!i)return;i.addEventListener('blur',()=>uSmart(f));i.addEventListener('keydown',x=>{if(x.key=='Enter')uSmart(f)});i.insertAdjacentHTML('afterend','<p class="uhint">Tip: type “Quiz tomorrow 3pm” and the date and time fill in for you.</p>')};newTask=function(){_nt();sm()};newEvent=function(){_ne();sm()}}
