const aiRefresh=()=>{const o=$('#aio');if(o)o.innerHTML=aiOut();const b=$('#aib');if(b)b.disabled=!!AI.busy};
const formV=fs=>`<form class="fm" onsubmit="aiGo(this);return false">${fs.map(f=>`<label>${f[0]}${f[2]=='area'?`<textarea name="${f[1]}" rows="3" placeholder="${e(f[3])}" ${f[1]=='t'?'required':''}></textarea>`:f[2]=='sel'?`<select name="${f[1]}">${f[3].split(',').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${f[1]}" type="${f[2]=='num'?'number':'text'}" ${f[2]=='num'?`value="${f[3]}" min="1"`:`placeholder="${e(f[3])}"`} ${f[1]=='t'?'required':''}>`}</label>`).join('')}<button class="btn pr" id="aib">Generate</button></form>`,
chatV=()=>`<form class="af" onsubmit="aiGo(this);return false"><input name="q" placeholder="Ask about lessons, activities, or ideas" required autocomplete="off"><button class="btn pr">Send</button></form>`;
function aiP(){const m=AI.m;return bkB()+`<div class="hd"><div><h1>AI Assistant</h1><p class="mu">Draft lesson materials fast. You review and edit everything.</p></div></div><div class="note">Do not type student names or personal details. AI can make mistakes, so check the results. It does not grade students.</div>
<div class="fts">${Object.keys(AIM).map(k=>`<button class="${k==m?'on':''}" onclick="AI.m='${k}';AI.out='';AI.err='';render()">${AIM[k][0]}</button>`).join('')}</div><div class="card aic">${m=='chat'?chatV():formV(AIM[m][1])}<div id="aio">${aiOut()}</div></div>`}
async function tok(){if(!sb||UID=='test')throw new Error('Sign in with a real school account to use the assistant. The test login cannot.');const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Your session expired. Sign in again.');return session.access_token}
async function aiGo(f){const m=AI.m;let inp;
if(m=='chat'){inp=f.q.value.trim();if(!inp)return;AI.h.push({role:'user',text:inp});f.q.value=''}else inp=AIM[m][1].map(x=>f[x[1]].value.trim()?x[0]+': '+f[x[1]].value.trim():'').filter(Boolean).join('\n');
AI.busy=1;AI.err='';if(m!='chat')AI.out='';aiRefresh();
try{const r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await tok()},body:JSON.stringify({mode:m,input:inp,history:m=='chat'?AI.h.slice(0,-1):[]})}),d=await r.json().catch(()=>({}));
if(!r.ok)throw new Error(d.error||'The assistant is not available. Make sure the Vercel function is deployed.');
if(m=='chat')AI.h.push({role:'model',text:d.text});else{AI.out=d.text;AI.t=AIM[m][0]+(f.t?': '+f.t.value.trim().slice(0,50):'')}}
catch(x){AI.err=x.message;if(m=='chat'){AI.h.pop();f.q.value=inp}}
AI.busy=0;aiRefresh()}
const aiCopy=()=>navigator.clipboard.writeText(AI.out).then(()=>toast('Copied.'));
function aiSave(){NO.unshift({id:Date.now(),t:AI.t||'AI draft',h:md(AI.out),c:'',d:ymd(0),u:Date.now()});toast('Saved. Find it in More, then Notes.');render()}
function render(){
const u=S.u;if(!u){$('#app').innerHTML=login();return}
const N=NAV[u.role],ad=u.role!='teacher',lb=(N.find(n=>n[0]==S.v)||[])[2],
pg=(({teacher:{home,work,cal,cls,more,prof:profP},head:{ov:adminHome,prof:profP},sysadmin:{acc:sysAcc,prof:profP}})[u.role][S.v]||(()=>soon(lb)))();
$('#app').innerHTML=`<div class="app ${ad?'admin':''}"><aside class="side ${S.an?'an':''}"><div class="logo">${LG}<span>TASKLY<small>${ad?'Monitoring':'Senior High School'}</small></span></div>${N.map(n=>`<button class="nv ${S.v==n[0]?'on':''}" onclick="go('${n[0]}')"><span class="ic">${n[1]}</span>${n[2]}</button>`).join('')}<div class="sp"></div><div class="uc" role="button" tabindex="0" onclick="go('prof')"><span class="av">${u.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</span><span>${u.name}<small>${RL[u.role]}</small></span></div><button class="nv" onclick="out()">Sign out</button></aside>
<div class="main"><header class="top"><b class="logo mob">${LG}TASKLY</b>${ad?`<span class="mu dsk">${RL[u.role]}</span>`:`<input class="dsk" type="search" placeholder="Search tasks and classes" aria-label="Search" onkeydown="if(event.key=='Enter'){S.q=this.value;go('work')}">`}<div class="sp"></div>${ad?'<button class="btn sm dsk" onclick="out()">Sign out</button>':'<button class="btn pr dsk" onclick="qa()">+ New</button>'}${ad?'':`<button class="bell" onclick="bell()" aria-label="Notifications">${BL}${unread()?`<i>${unread()}</i>`:''}</button>`}<span class="av" role="button" tabindex="0" onclick="go('prof')" title="${e(u.name)}">${u.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</span></header><main class="page ${S.an?'an':''}">${pg}</main></div>
<nav class="bnav ${S.an?'an':''}">${N.map(n=>`<button class="${S.v==n[0]?'on':''}" onclick="go('${n[0]}')"><span class="ic">${n[1]}</span>${n[2]}</button>`).join('')}</nav>${ad?'':'<button class="fab" onclick="qa()" aria-label="New">+</button>'}</div>`;if(S.an){S.an=0;cnt()}qs()}
boot();
</script>
</body>
</html>
