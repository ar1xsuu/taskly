body .g>.stat:nth-child(1){--tp:#ffe45e}body .g>.stat:nth-child(2){--tp:#9fe0bd}body .g>.stat:nth-child(3){--tp:#a9d4f5}body .g>.stat:nth-child(4){--tp:#f7b9c4}

@media(hover:hover){body .stat:hover{transform:rotate(0) translateY(-4px)}body .cc:hover{transform:translateY(-4px) rotate(-.6deg)}body .pg:hover{transform:rotate(0) translateY(-4px)}body .fd:hover{transform:translateY(-5px) rotate(-1deg)}}

.nx{background:#ffffff1a}

.ds-now::before{animation:ping 1.8s infinite}
.dchips{display:none;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.dc{flex:none;display:grid;gap:1px;padding:8px 12px;border-radius:12px;background:#ffffff1c;border:1px solid #ffffff26;color:#e3f1e8;font-weight:700;font-size:13px}

body .cnv{flex-wrap:wrap}
body .cnv .btn.pr{width:auto;border-radius:99px;padding:0 18px;font-size:14px;white-space:nowrap}

body .calw>.card:first-child::before{content:"";position:absolute;top:-12px;left:22px;right:22px;height:24px;background:radial-gradient(ellipse 6px 10px at 50% 50%,#fff 0 45%,#0b2a1d 50% 72%,transparent 77%) 0 0/26px 24px repeat-x;pointer-events:none}
body .pg{position:relative;background:var(--pc,#fff6b0);border:0;border-radius:3px 3px 14px 3px;box-shadow:0 14px 20px -12px #0b2a1d66;transform:rotate(var(--rt,-1deg));padding:22px 18px 16px;min-height:150px;transition:transform .25s}
#nl>.pg:nth-child(4n+1){--pc:#fff6b0;--rt:-1.2deg}#nl>.pg:nth-child(4n+2){--pc:#cdeedb;--rt:.9deg}#nl>.pg:nth-child(4n+3){--pc:#ffd9c9;--rt:-.6deg}#nl>.pg:nth-child(4n){--pc:#d4e6fb;--rt:1.1deg}

body .pg p{font:600 20px/23px Caveat,var(--hf);color:#2d3b33}
body .ed{background:linear-gradient(90deg,transparent 54px,#f2b8b0 54px 55px,transparent 55px),repeating-linear-gradient(#fff 0 27px,#dcebe1 27px 28px);padding:6px 20px 40px 72px;border-radius:6px 18px 18px 18px}
body .fd{background:var(--mn);border:1px solid #d9bd5e;box-shadow:0 6px 12px -8px #0b2a1d66}

.lrw{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
body .card:has(>.tile){display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 18px;padding:0;background:none;border:0;box-shadow:none}
.tile:nth-child(4n+1){--tc:#fff0a8}.tile:nth-child(4n+2){--tc:#cdeedb}.tile:nth-child(4n+3){--tc:#ffd9c9}.tile:nth-child(4n){--tc:#d4e6fb}

body .emp b{font:700 26px/1.1 Caveat,var(--hf);color:var(--ink)}
body #tst{background:var(--hl);color:var(--ink);border-radius:3px 3px 14px 3px;font-weight:700;box-shadow:0 14px 24px -12px #0b2a1d77}
.an .card,.an .note,.an .stat,.an .tile{animation:pgIn .55s cubic-bezier(.2,.8,.2,1) both}

body .g{gap:28px 14px}

/* ===== TASKLY create-flow layer ===== */
body dialog:has(.cf){padding:0;border:0;width:min(580px,calc(100% - 24px));max-height:min(92dvh,880px);overflow:hidden;border-radius:6px 24px 24px 24px;background:#fffdf8;box-shadow:0 36px 70px -24px #0b2a1dcc}
dialog[open]:has(.cf){display:flex;flex-direction:column}
dialog:has(.cf)::backdrop{background:#0b2a1d99;backdrop-filter:blur(3px)}
.cf{display:flex;flex-direction:column;min-height:0;flex:1}
.cf-h{display:flex;align-items:center;gap:14px;padding:20px 22px 14px}
.cf-ic{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:14px;background:#ffe45e;color:var(--ink);transform:rotate(-4deg)}.cf-ic.ev{background:#9fe0bd}
.cf-h h2{margin:0;font:800 25px/1.1 var(--hf);letter-spacing:-.02em}.cf-h p{margin:3px 0 0;color:var(--mu);font-size:14px}
.cf-x{margin-left:auto;align-self:flex-start}
.cf-b{overflow:auto;display:grid;gap:22px;padding:4px 22px 20px;overscroll-behavior:contain}
.cf-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1.5px dashed var(--bd);background:#fff}
.cf section{display:grid;gap:10px}
.cf h3{display:flex;align-items:center;gap:10px;margin:0;font:700 16px var(--hf)}
.cf h3 i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font:700 12px Figtree,sans-serif;font-style:normal}
.cf h3 small,.cf small{color:var(--mu);font-weight:500}
body .cf-t{font:700 20px/1.2 var(--hf);padding:14px 16px;border-width:2px}
.cf-ch{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cf-r{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cf-hint{margin:0;color:var(--mu);font-size:13.5px}.cf-hint.wn{color:var(--wn)}
.cf [hidden]{display:none!important}
.cfc{position:relative;display:inline-flex;align-items:center;padding:9px 15px;border-radius:99px;border:1.5px solid var(--bd);background:#fff;font:600 14px Figtree,system-ui,sans-serif;color:var(--tx);cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.cfc input,.cfp input,.cfs input{position:absolute;opacity:0;pointer-events:none}
.cfc:hover{border-color:var(--pr);transform:translateY(-1px)}
.cfc.on,.cfc:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.cfc:has(input:focus-visible),.cfp:has(input:focus-visible),.cfs:has(input:focus-visible){outline:2px solid var(--pr);outline-offset:2px}
.cf-pr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cfp{position:relative;display:grid;gap:1px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bd);background:#fff;cursor:pointer;transition:background .15s,box-shadow .15s}
.cfp b{font:700 19px/1.1 Caveat,var(--hf)}
.cfp.er:has(input:checked){background:#fdeceb;border-color:var(--er,#ae2a1f);box-shadow:inset 0 -4px 0 var(--er,#ae2a1f)}
.cfp.wn:has(input:checked){background:#fdf1d8;border-color:var(--wn,#9a5b06);box-shadow:inset 0 -4px 0 var(--wn,#9a5b06)}
.cfp.in:has(input:checked){background:#e5eefc;border-color:var(--in,#2257c4);box-shadow:inset 0 -4px 0 var(--in,#2257c4)}
.cfs{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px dashed var(--bd);border-radius:14px;cursor:pointer}

.cfs input:checked+i{background:var(--pr)}.cfs input:checked+i::after{transform:translateX(19px)}
.cfs span{display:grid}
.cf-more{border:1.5px dashed var(--bd);border-radius:14px;padding:10px 14px;display:grid;gap:10px}.cf-more summary{cursor:pointer;font-weight:600;color:var(--pr)}
.cfv{display:grid;gap:8px;padding:14px 16px;border-radius:6px 16px 16px 16px;border:1px dashed #d9c98a;background:repeating-linear-gradient(#fffdf3 0 27px,#efe9cf 27px 28px)}

.cfv-r b{flex:1 1 100%;font-size:16px}

.hub-t::before{content:"";position:absolute;left:-1px;top:-9px;width:42%;height:10px;background:var(--tc);border:1px solid var(--bd);border-bottom:0;border-radius:8px 8px 0 0}
.hub-t .ti{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--tc);color:var(--ink)}
.hub-t b{font:700 25px/1 Caveat,var(--hf)}.hub-t small{font-size:13px;line-height:1.35}
.hub-t:hover{transform:translateY(-3px) rotate(-.5deg);box-shadow:0 14px 22px -14px #0b2a1d66}
.hub-t:last-child{grid-column:1/-1}
body .days{display:flex;flex-wrap:wrap;gap:8px}
body .days .ck{position:relative;padding:8px 14px;border-radius:99px;border:1.5px solid var(--bd);background:#fff;cursor:pointer;font-weight:600}
body .days .ck input{position:absolute;opacity:0}
body .days .ck:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.fq[hidden]{display:none}
.cnf{position:fixed;z-index:99;width:9px;height:12px;border-radius:2px;pointer-events:none;animation:cnf 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cnf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

.gpk{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}.gpk>div{display:flex;gap:6px;flex-wrap:wrap}

.tmr{position:relative;width:min(300px,70vw)}.tmr svg{width:100%;transform:rotate(-90deg)}.tr0,.tr1{fill:none;stroke-width:16}.tr0{stroke:#fff}.tr1{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset 1s linear}

.sbd{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;width:100%}.scc{position:relative;background:hsl(var(--h) 80% 88%);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:16px 12px;display:grid;gap:8px;text-align:center}

.bzg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:100%}.bzb{display:grid;gap:4px;min-height:130px;place-content:center;border:4px solid var(--ink);border-radius:26px;background:hsl(var(--h) 85% 80%);box-shadow:0 8px 0 var(--ink);font-size:20px;color:var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}

.cfw{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.cfw i{position:absolute;top:-16px;left:var(--x);width:9px;height:14px;background:var(--c);animation:cfd var(--d) ease-in forwards}@keyframes cfd{to{transform:translateY(105vh) rotate(var(--r))}}

/* task notebook */

dialog:has(.nb)::backdrop{background:#0b2a1dcc;backdrop-filter:blur(3px)}

function md(t){let h=e(t).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^#{1,2} (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>').replace(/^\s*\d+\. (.*)$/gm,'<li class="n">$1</li>');
h=h.replace(/(?:<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>').replace(/(?:<li class="n">.*<\/li>\n?)+/g,m=>'<ol>'+m.replace(/ class="n"/g,'')+'</ol>');
return h.split(/\n{2,}/).map(p=>/^<(h\d|ul|ol)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}

async function aiGo(f){const m=AI.m;let inp;
if(m=='chat'){inp=f.q.value.trim();if(!inp)return;AI.h.push({role:'user',text:inp});f.q.value=''}else inp=AIM[m][1].map(x=>f[x[1]].value.trim()?x[0]+': '+f[x[1]].value.trim():'').filter(Boolean).join('\n');
AI.busy=1;AI.err='';if(m!='chat')AI.out='';aiRefresh();
try{const r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await tok()},body:JSON.stringify({mode:m,input:inp,history:m=='chat'?AI.h.slice(0,-1):[]})}),d=await r.json().catch(()=>({}));
